<title>Gato a Casa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* Concepto: un escenario 16:9 con el juego dibujado en canvas y toda la interfaz (menús, HUD, diálogos) como capas HTML encima. Paleta de atardecer suave, a propósito de un solo tema. */
:root {
  --bg: #2b2342;
  --panel: #3b3160;
  --panel2: #4b4080;
  --line: #62569a;
  --ink: #fff4e6;
  --muted: #cfc6ea;
  --peach: #ffb07c;
  --mint: #86e0b8;
  --rose: #ff8aa0;
  --sky: #8fd6ff;
  --gold: #ffd25a;
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #1a1530; border-radius: 14px; overflow: hidden; border: 2px solid var(--line); }
canvas#game { display: block; width: 100%; height: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

/* HUD */
.hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 8px 10px; pointer-events: none; }
.hud[hidden], .goal[hidden], .hint[hidden], .dlg[hidden] { display: none; }
.hl { display: flex; flex-direction: column; gap: 4px; }
.hr { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
.lives, .hearts { display: flex; gap: 3px; align-items: center; background: rgba(30,22,52,.62); border-radius: 999px; padding: 3px 8px; min-height: 24px; }
.lives svg { width: 15px; height: 15px; }
.hearts svg { width: 17px; height: 15px; }
.tokpill { display: flex; gap: 6px; align-items: center; background: rgba(30,22,52,.62); border-radius: 999px; padding: 3px 11px; font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; }
.tokpill svg { width: 16px; height: 16px; }
.ibtn { pointer-events: auto; border: 0; background: rgba(30,22,52,.62); width: 32px; height: 32px; border-radius: 50%; font-weight: 800; letter-spacing: -1px; cursor: pointer; }
.goal { position: absolute; top: 72px; left: 10px; max-width: 62%; background: rgba(30,22,52,.62); border-radius: 10px; padding: 4px 10px; font-size: .82rem; pointer-events: none; }
.goal b { color: var(--gold); font-weight: 800; }
.hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: max-content; max-width: 92%; background: rgba(255,244,230,.96); color: #3a2a4a; border-radius: 14px; padding: 8px 16px; font-weight: 800; text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,.2); pointer-events: none; }
.hint kbd { font: 800 .8rem var(--body); background: #fff; border: 2px solid #cfc0e8; border-bottom-width: 4px; border-radius: 6px; padding: 0 7px; }

/* Diálogo */
.dlg { position: absolute; left: 4%; right: 4%; bottom: 10px; background: #fff4e6; color: #3a2a4a; border-radius: 16px; padding: 10px 16px 12px; box-shadow: 0 5px 0 rgba(0,0,0,.25); cursor: pointer; }
.dlg .who { font-family: var(--display); font-weight: 600; color: #b5476a; font-size: .95rem; }
.dlg p { margin: 2px 0 0; font-weight: 700; }
.dlg .go { display: block; text-align: right; font-size: .75rem; color: #8b7aa8; margin-top: 2px; }

/* Pantallas */
.screen { position: absolute; inset: 0; display: flex; overflow: auto; background: radial-gradient(120% 100% at 50% 0%, rgba(70,52,120,.88), rgba(24,18,44,.95)); padding: 14px; }
.screen[hidden] { display: none; }
.scr { margin: auto; width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 12px; }
.scr.mid { max-width: 520px; align-items: center; text-align: center; }
.logo { font-family: var(--display); font-weight: 600; font-size: clamp(2rem, 7vw, 3.6rem); line-height: 1; margin: 0; color: var(--ink); text-shadow: 0 4px 0 #6b3d8f; text-wrap: balance; }
.logo span { color: var(--peach); }
h2.t { font-family: var(--display); font-weight: 600; font-size: clamp(1.4rem, 4.5vw, 2.1rem); margin: 0; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: .95rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.c { justify-content: center; }
.btn { border: 0; border-radius: 999px; background: var(--peach); color: #3a1f12; font-family: var(--display); font-weight: 600; font-size: 1.05rem; padding: 10px 24px; cursor: pointer; box-shadow: 0 4px 0 #c27a4a; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c27a4a; }
.btn.alt { background: var(--panel2); color: var(--ink); box-shadow: 0 4px 0 #2f2758; }
.btn.mint { background: var(--mint); box-shadow: 0 4px 0 #4fa682; color: #12372a; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.badge { display: inline-flex; gap: 6px; align-items: center; background: rgba(255,210,90,.16); border: 1px solid rgba(255,210,90,.5); color: var(--gold); border-radius: 999px; padding: 2px 12px; font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; }
.badge svg { width: 15px; height: 15px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.lv { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; text-align: left; min-width: 0; }
.lv b { font-family: var(--display); font-weight: 600; font-size: 1.02rem; }
.lv small { color: var(--muted); font-size: .8rem; }
button.lv { cursor: pointer; }
.lv.on:hover { border-color: var(--peach); }
.lv.lock, .lv.soon { opacity: .6; }
.st { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; }
.st.ok { color: var(--mint); } .st.lk { color: var(--rose); } .st.sn { color: var(--sky); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 5px 12px; font-weight: 800; font-size: .88rem; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.opt[aria-pressed="true"] { border-color: var(--peach); background: var(--panel2); }
.opt .cost { color: var(--gold); font-variant-numeric: tabular-nums; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); cursor: pointer; padding: 0; position: relative; }
.sw[aria-pressed="true"] { border-color: #fff; }
.sw.locked::after { content: attr(data-cost); position: absolute; inset: auto -4px -6px auto; background: #2b2342; border: 1px solid var(--gold); color: var(--gold); border-radius: 8px; font-size: .62rem; font-weight: 800; padding: 0 4px; }
.fieldlab { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 800; margin: 2px 0 4px; }
.two { display: grid; grid-template-columns: minmax(150px, 230px) 1fr; gap: 16px; align-items: start; }
.two > * { min-width: 0; }
canvas#prev { width: 100%; max-width: 230px; aspect-ratio: 1; background: radial-gradient(circle at 50% 40%, #6b5aa8, #3b3160); border-radius: 16px; display: block; }
input.name { font: inherit; font-weight: 800; background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 6px 10px; width: 100%; max-width: 240px; }
.sum { display: grid; grid-template-columns: 1fr auto; gap: 4px 18px; width: 100%; max-width: 340px; text-align: left; font-weight: 700; }
.sum span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); }
.sum .lab { color: var(--muted); font-weight: 700; }

/* Controles táctiles */
.touch { display: none; justify-content: space-between; gap: 10px; user-select: none; -webkit-user-select: none; touch-action: none; }
.touch[hidden] { display: none; }
.touch .grp { display: flex; gap: 8px; }
.tbtn { font: 600 .95rem var(--display); min-width: 62px; min-height: 62px; padding: 0 10px; background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 14px; touch-action: none; -webkit-tap-highlight-color: transparent; }
.tbtn.down { background: var(--panel2); border-color: var(--peach); }
.tbtn.big { min-width: 84px; background: #6a3d8f; }
.rotate { margin: 0; text-align: center; color: var(--muted); font-size: .85rem; }
.rotate[hidden] { display: none; }
@media (pointer: coarse) { .touch:not([hidden]) { display: flex; } }
@media (orientation: landscape) and (max-height: 520px) {
  body { padding-block: 6px; }
  .wrap { position: relative; gap: 0; }
  .stage { width: min(100%, calc((100vh - 12px) * 1.7778)); margin-inline: auto; }
  .touch:not([hidden]) { position: absolute; left: 50%; transform: translateX(-50%); width: min(100%, calc((100vh - 12px) * 1.7778)); bottom: 10px; padding-inline: 10px; pointer-events: none; }
  .touch .tbtn { pointer-events: auto; opacity: .85; min-height: 52px; min-width: 52px; }
  .hint { bottom: 76px; max-width: 58%; font-size: .85rem; padding: 6px 12px; }
  .dlg { bottom: 74px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
@media (max-width: 560px) {
  .touch { flex-wrap: wrap; justify-content: center; }
  .touch .grp { flex: 1 1 auto; justify-content: center; }
  .tbtn { min-width: 58px; min-height: 56px; font-size: .85rem; padding: 0 8px; }
  .tbtn.big { min-width: 74px; }
  .hint { font-size: .7rem; padding: 4px 10px; bottom: 6px; }
  .goal { font-size: .68rem; top: 58px; }
  .lives svg { width: 11px; height: 11px; } .hearts svg { width: 13px; height: 12px; }
  .tokpill { padding: 2px 8px; font-size: .8rem; }
}
@media (max-width: 560px) { .two { grid-template-columns: 1fr; } canvas#prev { max-width: 130px; } .screen { padding: 8px; } }
</style>

<main class="wrap">
  <div class="stage" id="stage">
    <canvas id="game" width="960" height="540" aria-label="Juego de aventuras de un gato que busca el camino a casa"></canvas>
    <div class="hud" id="hud" hidden>
      <div class="hl">
        <div class="lives" id="hLives" role="img" aria-label="Vidas"></div>
        <div class="hearts" id="hHearts" role="img" aria-label="Salud"></div>
      </div>
      <div class="hr">
        <span class="tokpill" title="Tokens de este nivel"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#ffd25a" stroke="#c9962a" stroke-width="2"/><ellipse cx="12" cy="14.500" rx="4.200" ry="3.500" fill="#c9962a"/><circle cx="6.800" cy="10" r="1.800" fill="#c9962a"/><circle cx="10" cy="6.800" r="1.800" fill="#c9962a"/><circle cx="14" cy="6.800" r="1.800" fill="#c9962a"/><circle cx="17.200" cy="10" r="1.800" fill="#c9962a"/></svg><b id="hTok">0</b></span>
        <button class="ibtn" id="hPause" type="button" aria-label="Pausa">II</button>
      </div>
    </div>
    <div class="goal" id="hGoal" hidden></div>
    <div class="hint" id="hint" hidden></div>
    <div class="dlg" id="dlg" hidden></div>
    <div class="screen" id="screen"></div>
  </div>
  <div class="touch" id="touch" hidden>
    <div class="grp">
      <button class="tbtn" type="button" data-act="left" aria-label="Izquierda">&larr;</button>
      <button class="tbtn" type="button" data-act="right" aria-label="Derecha">&rarr;</button>
    </div>
    <div class="grp">
      <button class="tbtn" type="button" data-act="yarn">Estambre</button>
      <button class="tbtn" type="button" data-act="act">Actuar</button>
      <button class="tbtn big" type="button" data-act="jump">Saltar</button>
    </div>
  </div>
  <p class="rotate" id="rotate" hidden>Para jugar mejor, gira el celular de lado.</p>
</main>

<script>
/* ===== NÚCLEO: utilidades, partida guardada, catálogo, sonido y controles ===== */
(function () {
'use strict';
const G = window.G = {};
G.W = 960; G.H = 540;
G.$ = id => document.getElementById(id);
G.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
G.lerp = (a, b, t) => a + (b - a) * t;
G.hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
G.rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
G.hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
G.isTouch = false;
try { G.isTouch = window.matchMedia('(pointer: coarse)').matches; } catch (e) { /* nada */ }

/* ---------- Catálogo de personalización (cost 0 = gratis desde el inicio) ---------- */
G.CAT = {
  fur: [
    { n: 'Café', c: '#b48b5d', d: '#6e4c30', l: '#ecd5ae', cost: 0 },
    { n: 'Gris azulado', c: '#a2abc0', d: '#5f6a86', l: '#e3e8f3', cost: 0 },
    { n: 'Naranja', c: '#f0a65e', d: '#b5702c', l: '#ffe3bd', cost: 0 },
    { n: 'Negro', c: '#55506a', d: '#2a2640', l: '#a39db9', cost: 6 },
    { n: 'Crema', c: '#f1dfba', d: '#b9a074', l: '#fff6e2', cost: 6 },
    { n: 'Lila', c: '#bfa6ea', d: '#7e63b8', l: '#efe4ff', cost: 10 }
  ],
  pattern: [{ n: 'Liso', cost: 0 }, { n: 'Rayas', cost: 4 }, { n: 'Manchas', cost: 4 }, { n: 'Esmoquin', cost: 6 }],
  acc: [{ n: 'Ninguno', cost: 0 }, { n: 'Cascabel', cost: 3 }, { n: 'Moño', cost: 5 }, { n: 'Bufanda', cost: 7 }, { n: 'Sombrero', cost: 10 }],
  yarn: [{ n: 'Rojo', c: '#ff7a8a', cost: 0 }, { n: 'Azul', c: '#7fb8ff', cost: 3 }, { n: 'Verde', c: '#86dba0', cost: 3 }, { n: 'Amarillo', c: '#ffd56a', cost: 4 }]
};
/* Dificultad: nunca cambia las 7 vidas ni los tokens, solo el ritmo del reto. */
G.DIFF = {
  easy: { n: 'Tranquilo', d: 'Menos daño, enemigos más lentos y más comida en el camino.', dmg: 1, spd: 0.75, heal: 3, extra: true },
  normal: { n: 'Normal', d: 'El reto pensado para la mayoría. Un golpe quita un corazón.', dmg: 2, spd: 1, heal: 2, extra: true },
  hard: { n: 'Callejero', d: 'Enemigos más rápidos y menos comida extra. Mismas vidas y mismas recompensas.', dmg: 2, spd: 1.25, heal: 2, extra: false }
};
G.HP_MAX = 6;   /* 3 corazones, cada uno vale 2 puntos */
G.LIVES = 7;

/* ---------- Partida guardada ---------- */
const KEY = 'gato-a-casa-v1';
let mem = null;
G.fresh = () => ({
  started: false, diff: 'normal',
  cat: { name: 'Michi', fur: 2, pattern: 0, acc: 0, yarn: 0 },
  owned: { fur: [0, 1, 2], pattern: [0], acc: [0], yarn: [0] },
  tokens: 0, got: {}, done: {}, quests: {}, lost: 0, special: false
});
G.load = () => {
  let raw = mem;
  try { raw = localStorage.getItem(KEY) || mem; } catch (e) { /* sin almacenamiento */ }
  if (raw) { try { return Object.assign(G.fresh(), JSON.parse(raw)); } catch (e) { /* dañado */ } }
  return G.fresh();
};
G.store = () => {
  const s = JSON.stringify(G.save);
  mem = s;
  try { localStorage.setItem(KEY, s); } catch (e) { /* nada */ }
};
G.save = G.load();
G.owns = (type, i) => G.save.owned[type].indexOf(i) >= 0;
/* Equipa si ya es tuyo; si no, lo compra con tokens. Devuelve 'equip', 'buy' o 'no'. */
G.pick = (type, i) => {
  const item = G.CAT[type][i], s = G.save;
  if (G.owns(type, i)) { s.cat[type] = i; G.store(); return 'equip'; }
  if (s.tokens >= item.cost) { s.tokens -= item.cost; s.owned[type].push(i); s.cat[type] = i; G.store(); G.sfx.token(); return 'buy'; }
  G.sfx.hit();
  return 'no';
};

/* ---------- Sonido ---------- */
let ac = null;
G.muted = false;
function tone(f1, f2, dur, type, vol, delay) {
  if (G.muted) return;
  try {
    if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ac = new AC(); }
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t0 + dur);
    g.gain.setValueAtTime(vol || 0.05, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) { /* sin audio */ }
}
G.sfx = {
  jump: () => tone(330, 640, .13, 'triangle', .07),
  pounce: () => tone(700, 260, .12, 'sawtooth', .03),
  throw: () => tone(500, 800, .1, 'triangle', .05),
  eat: () => { tone(500, 700, .07, 'square', .04); tone(600, 800, .07, 'square', .04, .09); },
  drink: () => { tone(400, 300, .09, 'sine', .06); tone(450, 330, .09, 'sine', .06, .11); },
  token: () => { tone(880, 1320, .1, 'sine', .06); tone(1320, 1760, .14, 'sine', .05, .08); },
  hit: () => tone(260, 80, .22, 'sawtooth', .06),
  fall: () => tone(500, 70, .5, 'triangle', .07),
  pop: () => tone(300, 700, .08, 'square', .04),
  talk: () => tone(520 + Math.random() * 120, 460, .06, 'triangle', .04),
  step: () => { tone(740, 740, .08, 'sine', .06); tone(990, 990, .14, 'sine', .06, .09); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .22, 'triangle', .07, i * .13))
};
G.wake = () => { try { if (ac && ac.state === 'suspended') ac.resume(); } catch (e) { /* nada */ } };

/* ---------- Controles ---------- */
const I = G.in = { left: false, right: false, jump: 0, held: false, act: 0, yarn: 0 };
G.dialogOpen = false;
G.onDialogNext = null;
G.onPause = null;
G.clearInput = () => { I.left = I.right = false; I.jump = I.act = I.yarn = 0; I.held = false; };
G.label = a => {
  if (G.isTouch) return { jump: 'Saltar', act: 'Actuar', yarn: 'Estambre', move: 'las flechas' }[a];
  return { jump: 'Espacio', act: 'X', yarn: 'C', move: '← →' }[a];
};
const KEYS = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyX: 'act', KeyZ: 'act', KeyC: 'yarn', KeyV: 'yarn' };
function press(a) {
  if (G.dialogOpen) { if (a === 'jump' || a === 'act') { G.onDialogNext && G.onDialogNext(); } return; }
  if (a === 'jump') { I.jump = 0.12; I.held = true; }
  else if (a === 'act') I.act = 0.12;
  else if (a === 'yarn') I.yarn = 0.12;
  else I[a] = true;
}
function release(a) {
  if (a === 'jump') I.held = false;
  else if (a === 'left' || a === 'right') I[a] = false;
}
window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.code === 'Escape' || e.code === 'KeyP') { G.onPause && G.onPause(); return; }
  if (e.code === 'Enter' && G.dialogOpen) { e.preventDefault(); G.onDialogNext && G.onDialogNext(); return; }
  const a = KEYS[e.code];
  if (!a || !G.playing) return;
  e.preventDefault();
  if (e.repeat) return;
  press(a);
});
window.addEventListener('keyup', e => { const a = KEYS[e.code]; if (a) release(a); });
window.addEventListener('blur', G.clearInput);
G.playing = false;
document.querySelectorAll('.tbtn').forEach(b => {
  const a = b.dataset.act;
  const down = e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) { /* nada */ } b.classList.add('down'); press(a); };
  const up = e => { e.preventDefault(); b.classList.remove('down'); release(a); };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
})();

/* ===== ARTE: el gato personalizable y el estambre (dibujo suave) ===== */
(function () {
'use strict';
const G = window.G;
const TAU = Math.PI * 2;
function E(g, x, y, rx, ry, fill, stroke, lw, rot) {
  g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 2; g.stroke(); }
}
function limb(g, x0, y0, x1, y1, w, fill, edge) {
  g.lineCap = 'round';

    sheets: (def.posters || []).map(p => Object.assign({ found: false }, p)),
    cps: (def.cps || []).map(c => Object.assign({ on: false }, c)),
    questItems: (def.items || []).filter(it => !it.quest || G.quest(it.quest) !== 'done').map(it => Object.assign({ got: false }, it)),
    bell: def.bell ? Object.assign({ done: false, hit: 0 }, def.bell) : null,
    legs: def.legs ? Object.assign({ dir: 1 }, def.legs) : null,

  S.cam = Math.max(0, Math.min(def.width - W, S.p.x - W * .35));
  G.playing = true; G.clearInput();
  G.$('screen').hidden = true; G.$('hud').hidden = false; G.$('touch').hidden = !G.isTouch;
  G.$('rotate').hidden = !(G.isTouch && window.innerHeight > window.innerWidth);

G.toast = (s, secs) => { if (G.S) { G.S.toast = s; G.S.toastT = secs || 2.4; } };
G.burst = (x, y, n, cols, spd) => {
  if (!G.S) return;
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = (.3 + Math.random()) * (spd || 120); G.S.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 50, life: .6 + Math.random() * .3, max: .9, c: cols[i % cols.length], r: 1.800 + Math.random() * 2.500 }); }
};
G.reward = (id, n) => {
  const S = G.S, sv = G.save;
  if (sv.got[id]) return false;
  sv.got[id] = true; sv.tokens += n; S.tok += n; G.store(); G.sfx.token(); G.hud(true);
  G.toast('+' + n + ' tokens', 2.2);

/* ---------- Diálogos ---------- */
G.openDialog = function (lines, end) {
  const S = G.S, el = G.$('dlg'); let i = 0;
  S.mode = 'dialog'; G.clearInput(); G.dialogOpen = true; el.hidden = false;
  const show = () => {
    el.innerHTML = '<div class="who">' + esc(lines[i][0]) + '</div><p>' + esc(lines[i][1]) + '</p><span class="go">' + (i < lines.length - 1 ? 'Seguir' : 'Cerrar') + ' (' + esc(G.label('act')) + ' o toca aquí)</span>';
    G.sfx.talk();
  };
  G.onDialogNext = () => {
    i++;
    if (i >= lines.length) { el.hidden = true; G.dialogOpen = false; G.onDialogNext = null; if (S.mode === 'dialog') S.mode = 'play'; G.clearInput(); if (end) end(S); }
    else show();
  };
  el.onclick = () => G.onDialogNext && G.onDialogNext();
  show();
};

/* ---------- Vidas y salud ---------- */
function respawn() {
  const S = G.S, p = S.p;
  p.x = S.spawn.x; p.y = S.spawn.y - p.h; p.vx = 0; p.vy = 0; p.inv = 1.6; p.onGround = false; p.pounce = 0;
  S.hp = G.HP_MAX;
  S.cam = Math.max(0, Math.min(S.def.width - W, p.x - W * .35));
  S.yarn.on = false;
}
function loseLife(why) {
  const S = G.S;
  S.lives--; S.lostHere++;
  if (!S.def.tutorial) { G.save.lost++; G.store(); }
  if (S.def.tutorial && S.lives < 1) S.lives = 1;
  G.hud(true);
  if (S.lives <= 0) { S.mode = 'over'; G.playing = false; G.clearInput(); G.ui.showOver(S); return; }
  G.toast(why === 'fall' ? 'Caer cuesta una vida. Te quedan ' + S.lives : 'Sin salud: pierdes una vida. Te quedan ' + S.lives, 2.800);
  respawn();
}
function damage(n, fromX) {
  const S = G.S, p = S.p;
  if (p.inv > 0 || S.mode !== 'play') return;
  S.hp -= n; p.inv = 1.4; S.shake = .22;
  p.vx = (p.x + p.w / 2 < fromX ? -1 : 1) * 230; p.vy = -320;
  G.sfx.hit(); G.burst(p.x + 17, p.y + 8, 6, ['#ff8aa0', '#ffd25a'], 110);
  if (S.hp <= 0) { S.hp = 0; loseLife('hp'); } else G.hud(true);
}
function heal(n) { const S = G.S; S.hp = Math.min(G.HP_MAX, S.hp + n); G.hud(true); }

/* ---------- Acciones del gato ---------- */
function pounce() {
  const S = G.S, p = S.p;
  p.pounce = .22; p.pcd = .45; G.sfx.pounce();
  if (p.onGround) p.vx = p.face * 300;
  const box = { x: p.face > 0 ? p.x + p.w - 6 : p.x - 44, y: p.y - 12, w: 50, h: p.h + 18 };
  S.critters.forEach(m => {
    if (m.alive && G.hit(box, { x: m.x - 14, y: m.y - 16, w: 28, h: 16 })) {
      m.alive = false; S.mice++; S.flags.caught = true; heal(1); G.sfx.eat();
      G.burst(m.x, m.y - 8, 8, ['#fff', '#ffe26a', '#b9b2d3'], 130);
    }
  });
  S.monsters.forEach(m => {
    if (m.alive && G.hit(box, { x: m.x - 17, y: m.y - 36, w: 34, h: 36 })) { m.stun = 3 * (S.D.spd < 1 ? 1.4 : 1); G.sfx.pop(); G.burst(m.x, m.y - 30, 6, ['#ffe26a', '#fff'], 100); }
  });
}
function throwYarn() {
  const S = G.S, p = S.p, y = S.yarn;
  if (y.on || S.def.noYarn) return;
  y.on = true; y.x = p.x + p.w / 2 + p.face * 14; y.y = p.y + 4; y.vx = p.face * 430 + p.vx * .3; y.vy = -240; y.t = 0; G.sfx.throw();
}
function interactables() {
  const S = G.S, p = S.p, cx = p.x + p.w / 2, list = [];
  S.bowls.forEach(b => { if (b.cd <= 0) list.push({ x: b.x, y: b.y, label: b.kind === 'water' ? 'Beber' : 'Comer', run: () => useBowl(b) }); });
  S.npcs.forEach(n => list.push({ x: n.x, y: n.y, label: 'Hablar', run: () => talk(n) }));
  S.sheets.forEach(po => list.push({ x: po.x, y: po.y + 50, label: 'Leer', run: () => readPoster(po) }));
  let best = null, bd = 56;
  list.forEach(o => { const d = Math.abs(o.x - cx); if (d < bd && Math.abs(o.y - (p.y + p.h)) < 90) { bd = d; best = o; } });
  return best;
}
function useBowl(b) {
  const S = G.S;
  if (b.kind === 'water') { heal(1); S.flags.drank = true; b.cd = 12; G.sfx.drink; G.sfx.drink(); G.toast('Agua fresca. +1 de salud', 1.800); }
  else { heal(S.D.heal + 1); S.flags.ate = true; b.cd = 20; G.sfx.eat(); G.toast('¡Qué rico! La comida recupera salud', 2); }
  G.burst(b.x, b.y - 18, 8, b.kind === 'water' ? ['#bfe4ff', '#fff'] : ['#ffd25a', '#e0a060'], 90);
}
function talk(n) {
  const S = G.S; n.mark = false;
  const lines = n.dlg(S);
  G.openDialog(lines, () => { if (n.after) n.after(S); });
}
function readPoster(po) {
  const S = G.S;
  if (!po.found) { po.found = true; S.posters++; G.sfx.token(); }
  G.openDialog(po.lines, () => { if (S.posters >= S.def.posters.length && S.def.posterReward) G.reward(S.def.posterReward.id, S.def.posterReward.n); });
}

/* ---------- Actualización por cuadro ---------- */
G.update = function (dt) {
  const S = G.S; if (!S) return;
  S.t += dt; S.toastT = Math.max(0, S.toastT - dt); S.shake = Math.max(0, S.shake - dt);
  for (const q of S.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 520 * dt; q.life -= dt; }
  S.parts = S.parts.filter(q => q.life > 0);
  const p = S.p;
  /* la cámara sigue siempre */
  const tgt = G.clamp(p.x + p.w / 2 - W * .42 + p.face * 40, 0, S.def.width - W);
  S.cam += (tgt - S.cam) * Math.min(1, dt * 6);
  if (S.legs && S.legs.walk) { S.legs.x += S.legs.dir * 38 * dt; if (S.legs.x > S.legs.max) S.legs.dir = -1; if (S.legs.x < S.legs.min) S.legs.dir = 1; }
  if (S.mode !== 'play') return;

  const I = G.in;
  I.jump = Math.max(0, I.jump - dt); I.act = Math.max(0, I.act - dt); I.yarn = Math.max(0, I.yarn - dt);
  const dir = (I.left ? -1 : 0) + (I.right ? 1 : 0);
  const tg = dir * SPEED, acc = p.onGround ? 3000 : 1900;
  if (p.pounce > 0 && p.onGround) { /* el salto de ataque se frena solo */ }
  else if (p.vx < tg) p.vx = Math.min(tg, p.vx + acc * dt); else if (p.vx > tg) p.vx = Math.max(tg, p.vx - acc * dt);
  if (dir) p.face = dir;

  p.coyote = p.onGround ? .1 : Math.max(0, p.coyote - dt);
  if (I.jump > 0 && p.coyote > 0) { p.vy = -JUMP; p.coyote = 0; I.jump = 0; p.onGround = false; G.sfx.jump(); G.burst(p.x + 17, p.y + p.h, 4, ['#fff', '#d8cffa'], 60); }
  if (!I.held && p.vy < -220) p.vy += 3400 * dt;

  p.pcd = Math.max(0, p.pcd - dt); p.pounce = Math.max(0, p.pounce - dt);
  const near = interactables(); S.prompt = near;
  if (I.act > 0) { I.act = 0; if (near) near.run(); else if (p.pcd <= 0) pounce(); }
  if (S.mode !== 'play') return;
  if (I.yarn > 0) { I.yarn = 0; throwYarn(); }

  /* movimiento y choques */
  p.vy = Math.min(p.vy + GRAV * dt, 1000);
  p.x += p.vx * dt;
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  if (p.x > S.def.width - p.w) { p.x = S.def.width - p.w; p.vx = 0; }
  for (const s of S.solids) { if (G.hit(p, s)) { if (p.vx > 0) p.x = s.x - p.w; else if (p.vx < 0) p.x = s.x + s.w; p.vx = 0; } }
  const pb = p.y + p.h, was = !p.onGround;
  p.y += p.vy * dt; p.onGround = false;
  for (const s of S.solids) {
    if (G.hit(p, s)) { if (p.vy >= 0) { p.y = s.y - p.h; p.vy = 0; p.onGround = true; p.on = s.id || s.k; } else { p.y = s.y + s.h; p.vy = 0; } }
  }
  if (p.vy >= 0) for (const l of S.ledges) {
    if (p.x + p.w > l.x && p.x < l.x + l.w && pb <= l.y + 3 && p.y + p.h >= l.y) { p.y = l.y - p.h; p.vy = 0; p.onGround = true; p.on = l.id || l.k; }
  }
  if (p.onGround) { if (was) G.burst(p.x + 17, p.y + p.h, 3, ['#fff', '#cfc7dd'], 50); p.runT += Math.abs(p.vx) * dt * .055; } else p.on = '';
  p.inv = Math.max(0, p.inv - dt);
  if (p.y > H + 90) { G.sfx.fall(); loseLife('fall'); return; }

  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  /* tokens, comida y objetos de misión */
  S.tokens.forEach(t => {
    if (t.col || t.old) return;
    if ((t.x - cx) ** 2 + (t.y - cy) ** 2 < 28 * 28) { t.col = true; S.tok++; G.save.got[t.id] = true; G.save.tokens++; G.store(); G.sfx.token(); G.burst(t.x, t.y, 8, ['#ffd25a', '#fff'], 110); G.hud(true); }
  });
  S.foods.forEach(f => {
    if (f.eaten || (f.x - cx) ** 2 + (f.y - cy) ** 2 > 30 * 30) return;
    if (S.hp >= G.HP_MAX) { if (!S.flags.fullToast) { S.flags.fullToast = true; G.toast('Ya tienes la salud llena. Guárdalo para después', 2.500); } return; }
    f.eaten = true; heal(S.D.heal); S.flags.ate = true; G.sfx.eat(); G.burst(f.x, f.y, 6, ['#e0a060', '#fff'], 80);
  });
  S.questItems.forEach(it => {
    if (it.got || (it.x - cx) ** 2 + (it.y - cy) ** 2 > 30 * 30) return;
    it.got = true; S.items[it.id] = true; G.sfx.token(); G.burst(it.x, it.y, 8, ['#fff', '#ffd25a'], 100);
    G.toast(it.text || 'Encontraste algo', 2.400); if (it.onGet) it.onGet(S);
  });
  S.bowls.forEach(b => { b.cd = Math.max(0, b.cd - dt); });

  /* ratones */
  S.critters.forEach(m => {
    if (!m.alive) return;
    m.t += dt;
    const dx = m.x - cx, scared = Math.abs(dx) < 190 && Math.abs(m.y - (p.y + p.h)) < 80;
    let sp = 0;
    if (scared) { m.dir = dx >= 0 ? 1 : -1; sp = 165; if ((m.x >= m.max && m.dir > 0) || (m.x <= m.min && m.dir < 0)) sp = 0; }
    else if (m.pause > 0) m.pause -= dt;
    else { sp = 42; if (m.x >= m.max) m.dir = -1; if (m.x <= m.min) m.dir = 1; if (Math.random() < dt * .4) m.pause = .8; }
    m.x = G.clamp(m.x + m.dir * sp * dt, m.min, m.max);
  });

  /* monstruos y trampas */
  S.monsters.forEach(m => {
    if (m.sq > 0) { m.sq -= dt * 2; if (m.sq <= 0) m.alive = false; return; }
    if (!m.alive) return;
    if (m.stun > 0) m.stun -= dt;
    else {
      m.x += m.dir * m.sp * S.D.spd * dt;
      if (m.x >= m.max) m.dir = -1; if (m.x <= m.min) m.dir = 1;
      if (m.trapper) {
        m.tt -= dt;
        if (m.tt <= 0 && Math.abs(m.x - cx) < 400) {
          m.tt = 4.800 / S.D.spd;
          const dyn = S.traps.filter(t => !t.perm);
          if (dyn.length >= 3) S.traps.splice(S.traps.indexOf(dyn[0]), 1);
          S.traps.push({ x: m.x - m.dir * 26, y: m.y, age: 0, perm: false }); G.sfx.pop();
        }
      }
    }
    const r = { x: m.x - 16, y: m.y - 34, w: 32, h: 34 };
    if (G.hit(p, r)) {
      if (p.vy > 90 && p.y + p.h - r.y < 24) { m.sq = 1; S.flags.stomp = true; p.vy = -440; G.sfx.pop(); G.burst(m.x, m.y - 20, 10, ['#b99aea', '#fff', '#ffd25a'], 150); }
      else if (m.stun <= 0) damage(S.D.dmg, m.x);
    }
  });
  S.traps.forEach(t => {
    t.age += dt;
    if (t.age > .5 && G.hit(p, { x: t.x - 15, y: t.y - 14, w: 30, h: 14 }) && p.inv <= 0) { damage(S.D.dmg, t.x); if (!t.perm) t.age = -99; }
  });
  S.traps = S.traps.filter(t => t.age > -50);

  /* estambre */
  const y = S.yarn;
  if (y.on) {
    y.t += dt; y.vy += 1500 * dt; y.x += y.vx * dt; y.y += y.vy * dt; y.spin += y.vx * dt * .05;
    for (const s of S.solids) {
      if (y.x > s.x && y.x < s.x + s.w && y.y > s.y && y.y < s.y + s.h) {
        if (y.vy > 0 && y.y - y.vy * dt <= s.y + 4) { y.y = s.y - 1; y.vy *= -.45; y.vx *= .7; } else { y.x -= y.vx * dt; y.vx *= -.4; }
      }
    }
    S.monsters.forEach(m => { if (m.alive && m.sq <= 0 && Math.abs(y.x - m.x) < 24 && y.y > m.y - 40 && y.y < m.y + 4) { m.stun = 4; y.vx *= -.5; G.sfx.pop(); G.burst(m.x, m.y - 30, 6, ['#ffe26a', '#fff'], 100); } });
    if (S.bell && Math.abs(y.x - S.bell.x) < 28 && Math.abs(y.y - S.bell.y) < 34 && !S.bell.done) { S.bell.done = true; S.bell.hit = 1; S.flags.bell = true; G.sfx.step(); G.burst(S.bell.x, S.bell.y, 10, ['#ffd25a', '#fff'], 120); }
    if (y.t > 1.9 || y.y > H + 40) y.on = false;
  }
  if (S.bell && S.bell.hit > 0) S.bell.hit -= dt;

  /* puntos seguros y meta */
  S.cps.forEach(c => { if (!c.on && cx >= c.x) { c.on = true; S.spawn = { x: c.x + 10, y: c.y }; if (!c.hidden) { G.toast('Casita de cartón: punto seguro', 2); G.sfx.step(); G.burst(c.x, c.y - 30, 10, ['#ffd25a', '#fff'], 100); } } });
  const d = S.def;
  if (d.steps) {
    while (S.step < d.steps.length && d.steps[S.step].done(S)) { S.step++; G.sfx.step(); S.hudKey = ''; }
  }
  if (d.captions) d.captions.forEach(c => { if (!c.shown && cx >= c.x) { c.shown = true; G.toast(typeof c.text === 'function' ? c.text() : c.text, 3.600); } });
  if (cx >= d.goal.x && cx <= d.goal.x + d.goal.w && p.onGround && (!d.goal.need || d.goal.need(S))) finish();
  G.hud(false);
};

function finish() {
  const S = G.S, d = S.def;
  S.mode = 'end'; G.playing = false; G.clearInput(); G.sfx.win();
  G.save.done[d.id] = true;
  if (d.unlocks) G.save.unlocked = Object.assign(G.save.unlocked || {}, { [d.unlocks]: true });
  G.store();
  G.ui.showSummary(S);
}
})();

/* ===== DIBUJO EN PANTALLA, HUD y bucle principal ===== */
(function () {

/* ---------- HUD (solo toca el DOM cuando algo cambia) ---------- */

const heart = v => '<svg viewBox="0 0 26 23" aria-hidden="true"><path d="M13 22C-2 11 3 1 8.600 1c2.600 0 4 1.600 4.400 3 .4-1.400 1.800-3 4.400-3C23 1 28 11 13 22z" fill="' + (v >= 2 ? '#ff8aa0' : (v === 1 ? '#c26a82' : 'none')) + '" stroke="' + (v >= 1 ? '#ff8aa0' : '#6a5fa0') + '" stroke-width="2"/></svg>';
G.hud = function (force) {

  let h = ''; for (let i = 0; i < 3; i++) h += heart(G.clamp(S.hp - i * 2, 0, 2));

  G.$('hTok').textContent = S.tok;

/* ---------- Dibujo del mundo ---------- */
function draw() {
  const S = G.S;

  if (!S) { drawIdle(); return; }
  const d = S.def, t = S.t, cam = S.cam;
  G.drawBG(ctx, d.theme, cam, t);
  ctx.save();
  const sx = S.shake > 0 ? (Math.random() - .5) * S.shake * 18 : 0;
  ctx.translate(-Math.round(cam) + sx, 0);
  const x0 = cam - 80, x1 = cam + W + 80, vis = o => (o.x === undefined ? true : o.x > x0 - (o.w || 0) && o.x < x1);
  if (S.legs) G.drawLegs(ctx, S.legs, t);
  S.decor.forEach(o => { if (vis(o)) G.drawDecor(ctx, o, t); });
  S.pits.forEach(o => { if (vis(o)) G.drawPit(ctx, o); });
  S.solids.forEach(o => { if (vis(o) && o.k !== 'gate') G.drawSolid(ctx, o, d.theme); });
  S.solids.forEach(o => { if (vis(o) && o.k === 'gate') G.drawGate(ctx, o); });
  S.ledges.forEach(o => { if (vis(o)) G.drawLedge(ctx, o, d.theme); });
  S.signs.forEach(o => { if (vis(o)) G.drawSign(ctx, o.x, o.y, o.text); });
  if (d.door) G.drawDoor(ctx, d.door, t);

    ctx.fillStyle = '#3a2a4a'; ctx.font = '800 12px Nunito, sans-serif'; ctx.textAlign = 'center';

    ctx.fillStyle = '#3a2a4a'; ctx.fillText(S.toast, W / 2, 79, W - 60); ctx.globalAlpha = 1;
  }
}
function drawItem(g, o, t) {
  g.save(); g.translate(o.x, o.y + Math.sin(t * 3) * 2);

    g.fillStyle = '#fff6e0'; g.strokeStyle = '#c9b48a'; g.lineWidth = 2; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-9, -3); g.lineTo(9, -3); g.lineTo(9, 3); g.lineTo(-9, 3); g.closePath(); g.fill(); g.stroke();

}
